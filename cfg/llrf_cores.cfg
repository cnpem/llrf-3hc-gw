###############################################################################
# General Cores repository
###############################################################################

if {![info exists general_cores_dir]} {
  error "general_cores_dir must be defined before sourcing llrf_cores.cfg"
}

###############################################################################
# Repository directories
###############################################################################

set gc_axi_dir \
  "${general_cores_dir}/modules/axi"

set gc_common_dir \
  "${general_cores_dir}/modules/common"

set gc_dsp_dir \
  "${general_cores_dir}/modules/dsp"

set gc_wishbone_dir \
  "${general_cores_dir}/modules/wishbone"

###############################################################################
# Integration directories
###############################################################################

set axi4lite_wb_bridge_dir \
  "${gc_axi_dir}/axi4lite_wb_bridge"

set wb_crossbar_dir \
  "${gc_wishbone_dir}/wb_crossbar"

set wb_cic_dir \
  "${gc_wishbone_dir}/wb_cic"

set wb_linear_transform_dir \
  "${gc_wishbone_dir}/wb_2d_linear_transform"

set wb_acquisition_dir \
  "${gc_wishbone_dir}/wb_acquisition"

