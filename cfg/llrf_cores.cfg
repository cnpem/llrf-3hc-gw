###############################################################################
# General Cores repository
###############################################################################

if {![info exists general_cores_dir]} {
  error "general_cores_dir must be defined before sourcing llrf_cores.cfg"
}

###############################################################################
# Repository directories
###############################################################################

set gc_axi_dir \
  "${general_cores_dir}/modules/axi"

set gc_common_dir \
  "${general_cores_dir}/modules/common"

set gc_dsp_dir \
  "${general_cores_dir}/modules/dsp"

set gc_wishbone_dir \
  "${general_cores_dir}/modules/wishbone"

###############################################################################
# Integration directories
###############################################################################

set wb_axi4lite_bridge_dir \
  "${gc_wishbone_dir}/wb_axi4lite_bridge"

set wb_crossbar_dir \
  "${gc_wishbone_dir}/wb_crossbar"

set wb_cic_dir \
  "${gc_wishbone_dir}/wb_cic"

set wb_linear_transform_dir \
  "${gc_wishbone_dir}/wb_2d_linear_transform"

set wb_acquisition_dir \
  "${gc_wishbone_dir}/wb_acquisition"

set gc_iq_demodulator_dir \
  "${gc_dsp_dir}/gc_iq_demodulator"

###############################################################################
# Bus packages
###############################################################################

add_vhdl \
  "${gc_axi_dir}/axi4_pkg.vhd" \
  general_cores

add_vhdl \
  "${gc_wishbone_dir}/wishbone_pkg.vhd" \
  general_cores

###############################################################################
# General Cores packages
###############################################################################

add_vhdl2008 \
  "${gc_common_dir}/gencores_pkg.vhd" \
  general_cores

###############################################################################
# AXI4-Lite to Wishbone bridge
###############################################################################

add_vhdl \
  "${wb_axi4lite_bridge_dir}/wb_axi4lite_bridge.vhd" \
  general_cores

add_vhdl \
  "${wb_axi4lite_bridge_dir}/xwb_axi4lite_bridge.vhd" \
  general_cores

###############################################################################
# Wishbone SDB crossbar
###############################################################################

add_vhdl \
  "${wb_crossbar_dir}/sdb_rom.vhd" \
  general_cores

add_vhdl \
  "${wb_crossbar_dir}/xwb_crossbar.vhd" \
  general_cores

add_vhdl \
  "${wb_crossbar_dir}/xwb_sdb_crossbar.vhd" \
  general_cores

###############################################################################
# DSP blocks
###############################################################################

add_vhdl2008 \
  "${gc_dsp_dir}/gc_iq_demodulator.vhd" \
  general_cores

add_vhdl2008 \
  "${gc_dsp_dir}/gc_cic.vhd" \
  general_cores

###############################################################################
# Clock domain crossing
###############################################################################

add_vhdl2008 \
  "${gc_common_dir}/gc_sync.vhd" \
  general_cores

add_vhdl2008 \
  "${gc_common_dir}/gc_edge_detect.vhd" \
  general_cores

add_vhdl2008 \
  "${gc_common_dir}/gc_pulse_synchronizer2.vhd" \
  general_cores

add_vhdl2008 \
  "${gc_common_dir}/gc_sync_word_wr.vhd" \
  general_cores


