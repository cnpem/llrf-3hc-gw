#-------------------------------------------------------------------------------
# Project     : 3rd Harmonic Low-Level Radio Frequency
#-------------------------------------------------------------------------------
# File        : sis8300ku_llrf.cfg
# Platform    : Xilinx Vivado 2022.2
#-------------------------------------------------------------------------------
# Description : ESS FPGA Framework project configuration for the SIS8300KU.
#-------------------------------------------------------------------------------

# Project paths ################################################################

set cfg_dir \
  [file normalize [file dirname [info script]]]

set llrf_3hc_dir \
  [file normalize "${cfg_dir}/.."]

if {![info exists ::env(ESSFPGA_FRAMEWORK_DIR)]} {
  error "ESSFPGA_FRAMEWORK_DIR is not defined"
}

set framework_dir \
  [file normalize $::env(ESSFPGA_FRAMEWORK_DIR)]

set general_cores_dir \
  "${llrf_3hc_dir}/hdl/ip_cores/general-cores"

set llrf_rtl_dir \
  "${llrf_3hc_dir}/hdl/modules"

set llrf_platform_dir \
  "${llrf_3hc_dir}/hdl/platform/sis8300ku"

set clogic_config_pkg \
  "${llrf_platform_dir}/clogic_essffw_config_pkg.vhdl"

# Project settings #############################################################

set proj_name "sis8300ku_llrf"
set default_library "work"

# ADC clock period #############################################################

set adc_clk_period 8.0
set proc_clk_freq  125

# Configure framework ##########################################################

source "${framework_dir}/essffw_settings.cfg"

set ::essffw::core::processing_clk_freq       $proc_clk_freq
set ::essffw::core::daq::channel_count        10
set ::essffw::core::adc_resolution            16
set ::essffw::core::daq::sample_data_bits     16
set ::essffw::core::daq::dod_present          1
set ::essffw::core::daq::daq_pipeline_present true
set ::essffw::core::replay::channel_count     10

set ::essffw::modules::bsp  sis8300ku
set ::essffw::modules::rsp  dwc8vm1
set ::essffw::modules::fsp1 blank
set ::essffw::modules::fsp2 blank

source "${framework_dir}/sis8300ku_bsp.cfg"
source "${framework_dir}/dwc8vm1_rsp.cfg"

# BSP constraints ##############################################################

add_constraint \
  "${framework_dir}/hw/constraints/sis8300ku_bsp/dwc8vm1-pins.xdc"

# Custom logic framework configuration #########################################

add_vhdl2008 \
  "${clogic_config_pkg}" \
  $fw_config_library

# Custom logic interface types #################################################

add_vhdl2008 \
  "${framework_dir}/hw/rtl/blank_fsp/custom_logic_intf_types_pkg.vhdl" \
  $fw_interface_library
# LLRF cores and dependencies ##################################################

source "${cfg_dir}/llrf_cores.cfg"

# LLRF generated register banks ################################################

add_vhdl2008 \
  "${llrf_rtl_dir}/llrf_3hc_dsp_diag/cheby/wb_llrf_3hc_dsp_diag_regs.vhd" \
  general_cores

# LLRF sources #################################################################

add_vhdl2008 \
  "${llrf_rtl_dir}/llrf_3hc_pkg.vhd" \
  llrf_3hc

add_vhdl2008 \
  "${llrf_rtl_dir}/llrf_3hc_dsp.vhd" \
  llrf_3hc

add_vhdl2008 \
  "${llrf_rtl_dir}/llrf_3hc_dsp_diag/llrf_3hc_dsp_diag.vhd" \
  llrf_3hc

add_vhdl2008 \
  "${llrf_3hc_dir}/hdl/top/custom_logic_wrapper.vhd" \
  $framework_library

# Software applications ########################################################

add_application \
  "${llrf_3hc_dir}/sw/sis8300ku_llrf_config" \
  "configuration_controller" \
  "framework/board_support_package/bsp/configuration_controller/board_config_ctrl_bd/board_config_ctrl_i/configuration_controller"

# Build hooks ##################################################################

add_scripting_hook \
  pre_synthesis \
  FILE \
  "${framework_dir}/scripts/build_automation/pre_synth_update_info.tcl"

add_scripting_hook \
  pre_synthesis \
  CODE \
  "pre_synth_update_info ${clogic_config_pkg}"
